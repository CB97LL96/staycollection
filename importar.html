<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar backup</title>
<style>
:root{--bg:#FCF5F8;--surface:#fff;--ink:#2B2233;--ink2:#6E6178;--line:#EEDDE7;--accent:#F7B2CF;--accent-ink:#2B2233;--ok:#1D6B4B;--bad:#B0305F;--f-body:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#17131C;--surface:#221C29;--ink:#F3ECF4;--ink2:#BBAFC2;--line:#3A3145;--accent:#F29CC2;--accent-ink:#2A1222;--ok:#8EE0B8;--bad:#FF9EC1}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:18px;display:grid;gap:10px}
h1{margin:0;font-size:24px}p{margin:0;color:var(--ink2)}
button{justify-self:start;border:none;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;font-size:14px}td{padding:3px 12px 3px 0}td+td{text-align:right}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>Importar backup</h1>
  <div class="card">
    <p>Escolha o arquivo de backup exportado do artefato (<code>backup-colecao-skz.json</code>). Registros com o mesmo código são substituídos; os outros ficam como estão.</p>
    <input type="file" id="arq" accept="application/json,.json">
    <table id="resumo"></table>
    <button id="ir" disabled>Importar</button>
    <p id="msg"></p>
  </div>
  <p><a href="./">Voltar pro app</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
(async function(){
  const $ = s => document.querySelector(s), msg = (t, c) => { $("#msg").textContent = t; $("#msg").className = c || "" };
  if (!window.stay.sb) { msg("Falta preencher o config.js com os dados do Supabase.", "bad"); return }
  if (!await window.stay.getSession()) { window.stay.showLogin(); return }
  let rows = [];
  $("#arq").onchange = async e => {
    rows = []; $("#resumo").innerHTML = ""; $("#ir").disabled = true; msg("");
    try {
      const b = JSON.parse(await e.target.files[0].text());
      const cols = b && b.colecoes; if (!cols || typeof cols !== "object") throw new Error("formato");
      for (const [col, docs] of Object.entries(cols)) for (const [id, data] of Object.entries(docs)) rows.push({ col, id, data });
      $("#resumo").innerHTML = Object.entries(cols).map(([c, d]) => `<tr><td>${c}</td><td>${Object.keys(d).length}</td></tr>`).join("");
      $("#ir").disabled = !rows.length;
    } catch (err) { msg("Esse arquivo não parece um backup do app.", "bad") }
  };
  $("#ir").onclick = async () => {
    $("#ir").disabled = true;
    try {
      for (let i = 0; i < rows.length; i += 200) {
        msg(`Importando ${Math.min(i + 200, rows.length)} de ${rows.length}…`);
        const { error } = await window.stay.sb.from("docs").upsert(rows.slice(i, i + 200), { onConflict: "owner,col,id" });
        if (error) throw error;
      }
      msg(`Pronto: ${rows.length} registros importados.`, "ok");
    } catch (err) { msg("Parou no meio: " + (err.message || err) + ". Pode tentar de novo; o que já entrou é só substituído.", "bad"); $("#ir").disabled = false }
  };
})();
</script>
</body>
</html>
