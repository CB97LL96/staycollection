<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coleção SKZ</title>
<script>(function(){var t="light";try{var v=localStorage.getItem("novo-theme");if(v==="dark"||v==="light")t=v;else if(matchMedia("(prefers-color-scheme: dark)").matches)t="dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
:root{
  --bg:#F5F2EC;--surface:#FFFFFF;--surface2:#EEE9E1;--ink:#24211D;--ink2:#6A645B;--ink3:#948C80;--line:#E2DBD0;
  --accent:#3D5A4E;--accent-ink:#FFFFFF;--accent-soft:#E1EAE4;
  --late:#A3442C;--late-soft:#F6E3DC;--soon:#8A6418;--soon-soft:#F4EAD3;--ok:#3C6B4D;--ok-soft:#E0EDE3;--info:#3C5C7A;--info-soft:#E1E9F1;
  --r:16px;--r-sm:10px;--shadow:0 1px 2px rgba(36,33,29,.06),0 6px 18px rgba(36,33,29,.06);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#161513;--surface:#201E1B;--surface2:#2A2723;--ink:#EEE9E1;--ink2:#A79F94;--ink3:#7E776D;--line:#36322D;
  --accent:#9FC2AF;--accent-ink:#13201A;--accent-soft:#25332C;
  --late:#E89A84;--late-soft:#3A2420;--soon:#E3BE72;--soon-soft:#352C1A;--ok:#94C9A4;--ok-soft:#1F3125;--info:#9DBEDD;--info-soft:#1E2B38;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* casca */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.brand{font-weight:700;font-size:18px;padding:0 10px 18px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--ink3);font-size:12px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink2);font-weight:600;width:100%}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--surface2);color:var(--ink)}
.nv[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nv .ct{margin-left:auto;font-size:12px;font-weight:700;background:var(--late-soft);color:var(--late);border-radius:99px;padding:1px 8px}
.rail .add{margin-top:14px}
.rail .foot{margin-top:auto;display:grid;gap:6px;padding:0 6px}
.main{min-width:0;padding:28px 32px 120px;max-width:1080px;width:100%}
.proto{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:99px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;margin-bottom:18px}
.proto b{color:var(--ink)}
.tabbar{display:none}
.fab{display:none}

/* tipografia */
h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.lede{color:var(--ink2);margin:0 0 22px}
h2{font-size:16px;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12.5px;color:var(--ink3);font-weight:600}
h2 .r{margin-left:auto;font-size:14px;font-weight:700}

/* botões e chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px;border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-2px;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;min-height:34px}
.chip .c{color:var(--ink3);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{position:relative;margin:0 0 14px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px 11px 40px;font:inherit;color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3)}

/* avatares */
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface2) center/cover no-repeat;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink2);box-shadow:0 0 0 1px var(--line)}
.av.xs{width:22px;height:22px;font-size:9.5px}
.av.sm{width:30px;height:30px;font-size:11px}
.av.lg{width:52px;height:52px;font-size:17px}
.av.xl{width:68px;height:68px;font-size:22px}

/* pílulas de situação */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.guess{background:none;border:1px dashed var(--ink3);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* painéis e linhas */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rows>li:first-child>.row{border-top:0}
.row:hover{background:var(--surface2)}
.row .tx{min-width:0;flex:1}
.row .t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.row .s{color:var(--ink2);font-size:13.5px;display:flex;gap:6px;align-items:center;margin-top:2px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:700;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.date{flex:none;width:46px;text-align:center;line-height:1.05}
.date b{display:block;font-size:19px}
.date small{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.date.late b,.date.late small{color:var(--late)}
.date.none b{color:var(--ink3)}

/* início */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;border:0;text-align:left;cursor:pointer;display:grid;gap:2px}
.stat .k{color:var(--ink2);font-size:13.5px;font-weight:600}
.stat .n{font-size:26px;font-weight:750;letter-spacing:-.01em}
.stat .h{font-size:12.5px;color:var(--ink3)}
.stat.alert .n{color:var(--late)}
.todo{display:grid;gap:12px}
.task{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center}
.task .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2)}
.task .ic svg{width:20px;height:20px}
.task.late .ic{background:var(--late-soft);color:var(--late)}
.task.soon .ic{background:var(--soon-soft);color:var(--soon)}
.task.info .ic{background:var(--info-soft);color:var(--info)}
.task .tx{flex:1;min-width:0}
.task .t{font-weight:650}
.task .s{color:var(--ink2);font-size:13.5px}
.calm{text-align:center;color:var(--ink2);padding:40px 16px;background:var(--surface);border-radius:var(--r)}

/* coleção */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.tile{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:grid;gap:6px;min-width:0}
.ph{position:relative;display:block;aspect-ratio:55/85;border-radius:10px;background:var(--surface2) center/cover no-repeat;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.ph.wide{aspect-ratio:1}
.ph.txt{display:grid;place-items:center;padding:10px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);border:1px dashed var(--ink3)}
.ph .bdg{position:absolute;left:6px;bottom:6px;right:auto}
.ph .cp{position:absolute;right:6px;top:6px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 7px}
.tile .cap{font-size:12.5px;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .cap small{color:var(--ink3);display:block}
.tile.dim .ph{opacity:.5}
.more{display:flex;justify-content:center;margin:20px 0}

/* CEGs */
.cgroup{margin-top:26px}
.chead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.chead .tx{min-width:0}
.chead b{font-size:18px;display:block}
.chead small{color:var(--ink2)}
.chead .r{margin-left:auto;text-align:right;font-weight:700}
.cegs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ceg{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;border:0;text-align:left;cursor:pointer;display:grid;gap:12px;min-width:0}
.ceg:hover{box-shadow:0 0 0 1px var(--ink3),var(--shadow)}
.ceg .top{display:flex;gap:12px;align-items:center;min-width:0}
.ceg .top .tx{min-width:0;flex:1}
.ceg .t,.ceg .s{display:block}
.ceg .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ceg .s{font-size:13px;color:var(--ink2)}
.strip{display:flex;gap:6px;min-height:0;overflow:hidden;align-items:center}
.strip .ph{width:38px;flex:none;border-radius:6px}
.strip .more-n{white-space:nowrap;font-size:12.5px;color:var(--ink2);font-weight:700;margin-left:4px}
.steps{display:flex;align-items:center;gap:4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}
.steps i.on{background:var(--accent)}
.steps i.now{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stepl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:4px}
.stepl b{color:var(--ink)}
.bigsteps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:0}
.bigsteps li{display:flex;gap:12px;align-items:center;padding:6px 0;color:var(--ink3);font-size:14px}
.bigsteps li .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.bigsteps li.on{color:var(--ink2)}
.bigsteps li.on .d{background:var(--accent);border-color:var(--accent)}
.bigsteps li.now{color:var(--ink);font-weight:700}
.bigsteps li.now .d{box-shadow:0 0 0 4px var(--accent-soft)}

/* folha lateral */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.38);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-h .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}
.sh-b{overflow:auto;padding:18px 18px 40px;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:14px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.hero .big{font-size:28px;font-weight:750;letter-spacing:-.01em}
.cardhero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}
.cardhero .ph{width:150px}
.note{font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 12px;margin:14px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.mini .cap{font-size:11.5px}
.picker .tile.sel .ph{box-shadow:0 0 0 3px var(--accent)}
.picker .tile.sel .ph::after{content:"✓";position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.stepper{display:flex;gap:6px;margin-bottom:16px}
.stepper span{flex:1;height:4px;border-radius:9px;background:var(--surface2)}
.stepper span.on{background:var(--accent)}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-weight:600;font-size:14px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast .undo{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer;margin-left:10px;padding:4px}
.empty{color:var(--ink2);padding:24px 0}

/* celular */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding:18px 16px 120px}
  h1{font-size:23px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:650;color:var(--ink3);padding:6px 0;cursor:pointer;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar .ct{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;font-weight:800;background:var(--late);color:#fff;border-radius:99px;padding:0 5px;line-height:16px}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:12px 18px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:first-child{grid-column:1/-1}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .cegs{grid-template-columns:1fr}
  .sheet{top:auto;height:92vh;width:100%;border-radius:20px 20px 0 0;transform:translateY(102%)}
  .sheet.on{transform:none}
  .cardhero{grid-template-columns:110px 1fr}
  .cardhero .ph{width:110px}
  .row{padding:12px 14px;gap:12px}
}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Seções">
    <div class="brand">Coleção SKZ</div>
    <div id="navlinks"></div>
    <button class="btn pri add" data-act="nova" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova compra</button>
    <div class="foot">
      <button class="btn sm" data-act="tema" type="button">Tema claro/escuro</button>
      <a class="btn sm" href="/antigo.html">App antigo</a>
    </div>
  </nav>
  <main class="main" id="main"><p class="empty">Carregando…</p></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
<button class="btn pri fab" data-act="nova" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova compra</button>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" aria-hidden="true">
  <div class="sh-h"><span class="t" id="shT"></span><button class="x" data-act="fechar" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sh-b" id="shB"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
(function(){
"use strict";
// App novo: lê e grava no mesmo banco do app atual. Toda gravação oferece "desfazer".

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(typeof v==="number"&&isFinite(v))?v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"";
const pd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=s=>{const d=pd(s);return d?Math.round((d-today())/864e5):null};
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fdd=s=>{const d=pd(s);return d?d.getDate()+" "+MES[d.getMonth()]:""};
const plural=(n,a,b)=>n+" "+(n===1?a:b);
const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const okUrl=u=>/^\/_blob\/[0-9a-f]{32}$/.test(u||"")||/^https:\/\/[A-Za-z0-9.-]+\/[A-Za-z0-9._~\/%=&?+-]*$/.test(u||"");
const I={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cards:'<rect x="4" y="3" width="11" height="16" rx="2"/><path d="M18 7l2 .5-3.5 13-8-2"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',

// ---------- modelo: coleção ----------
let colCache={v:-1,out:[]};
function colecao(){
  if(colCache.v===ver)return colCache.out;
  const byCard=new Map(), out=[];
  const add=(cid,f,d)=>{const c=CIDX.get(cid); if(!c)return false; let e=byCard.get(cid); if(!e){e={key:cid,card:c,nome:c.v||c.s||"",era:c.e||"",membro:membro(c.m),tipo:/[áa]lbum/i.test(c.t||"")?"Álbum":"Photocard / set",fases:[],itens:[]};byCard.set(cid,e)} if(d)e.itens.push(d); e.fases.push(f); return true};
  list("itens").forEach(d=>{
    const f=faseDe(d.status); if(f==="fora")return;
    const cards=Array.isArray(d.cards)?d.cards:[];
    const ok=cards.length&&COL?cards.map(cid=>add(cid,f,d)).some(Boolean):false;
    if(!ok)out.push({key:"i-"+d.id,card:null,item:d,nome:d.item||"",era:cegLbl(d)||d.ceg||"",membro:membro(d.membro),tipo:tipoDe(d),fases:[f],itens:[d],semCard:tipoDe(d)==="Photocard / set"});
  });
  if(COL)Object.values(posse).forEach(m=>Object.entries(m||{}).forEach(([cid,st])=>{
    const f=st==="tenho"?"rec":st==="caminho"?"cam":st==="quero"?"quero":""; if(!f)return;
    const e=byCard.get(cid); if(e&&(f==="quero"||e.itens.length))return; add(cid,f,null);
  }));
  list("acervo").forEach(d=>out.push({key:"a-"+d.id,card:null,acervo:d,nome:d.nome||"",era:d.era||"",membro:membro(d.membro),tipo:d.tipo||"Merch",fases:[d.st==="caminho"?"cam":"rec"],itens:[]}));
  byCard.forEach(e=>out.push(e));
  out.forEach(e=>{e.fase=e.fases.reduce((a,f)=>FORD[f]>FORD[a]?f:a,e.fases[0]); e.copias=Math.max(1,e.itens.length); if(e.fases.includes("rec")&&e.itens.length&&!e.itens.some(d=>faseDe(d.status)==="rec"))e.copias=e.itens.length+1;});
  colCache={v:ver,out};
  return out;
}
const bgOf=e=>e.card?cardBg(e.card):e.acervo?(fotoUrl("acervo-"+e.acervo.id)?`background-image:url('${fotoUrl("acervo-"+e.acervo.id)}');background-size:cover`:""):e.item?itemBg(e.item):"";

const ABERTA=["Pendente","A confirmar","Aguardando a GOM","Não liberado"];
const vencida=c=>{const n=daysTo(c.prazo);return n!=null&&n<0};
const devo=c=>c.status==="Pendente"||(c.status==="A confirmar"&&vencida(c));
function contas(){
  const all=list("cobrancas");
  const devoL=all.filter(devo), conf=all.filter(c=>c.status==="A confirmar"&&!vencida(c)), fut=all.filter(c=>c.status==="Aguardando a GOM"||c.status==="Não liberado");
  const pagas=all.filter(c=>c.status==="Paga").sort((a,b)=>String(b.pagoEm||"").localeCompare(String(a.pagoEm||"")));
  const soma=a=>a.reduce((s,c)=>s+(typeof c.valor==="number"?c.valor:0),0);
  return {devoL,conf,fut,pagas,soma,venc:devoL.filter(vencida)};
}
const byPrazo=(a,b)=>{const x=pd(a.prazo),y=pd(b.prazo);if(x&&y)return x-y;if(x)return -1;if(y)return 1;return 0};

// ---------- modelo: CEGs ----------
const CSTEPS=["Comprando","Na proxy","A caminho","No Brasil","Liberado","Enviado","Comigo"];
const CEG_ST={"Em andamento":0,"Aguardando cobrança":0,"Na proxy":1,"A caminho do Brasil":2,"Com a GOM no Brasil":3,"Com a Isa":3,"Envio liberado":4,"Enviado":5,"Recebido":6,"Concluída":6};
const F2S={esp:0,cam:1,br:3,lib:4,ped:5,rec:6};
let cegCache={v:-1,out:[]};
function cegs(){
  if(cegCache.v===ver)return cegCache.out;
  const m=new Map(), key=(com,n)=>(com||"")+"\u0001"+(n||"");
  const get=(com,n)=>{const k=key(com,n); if(!m.has(k))m.set(k,{key:k,com:com||"",nome:n||"",doc:null,itens:[],contas:[]}); return m.get(k)};
  list("cegs").forEach(g=>{const r=get(g.comunidade,g.nome); r.doc=g;});
  list("itens").forEach(d=>{ if(!d.ceg)return; if(faseDe(d.status)==="fora")return; get(d.comunidade,d.ceg).itens.push(d); });
  list("cobrancas").forEach(c=>{ if(!c.ceg)return; get(c.comunidade,c.ceg).contas.push(c); });
  const out=[...m.values()].map(r=>{
    const st=r.doc&&r.doc.status in CEG_ST?CEG_ST[r.doc.status]:null;
    const fs=r.itens.map(d=>F2S[faseDe(d.status)]).filter(x=>x!=null);
    const step=st!=null?st:(fs.length?Math.min(...fs):0);
    const deve=r.contas.filter(devo).reduce((s,c)=>s+(c.valor||0),0);
    const ativos=r.itens.filter(d=>faseDe(d.status)!=="rec").length;
    const aberta=ativos>0||r.contas.some(c=>ABERTA.includes(c.status))||(st!=null&&st<6);
    return {...r,step,deve,ativos,aberta,lbl:cegLbl({ceg:r.nome,comunidade:r.com})};
  });
  cegCache={v:ver,out}; return out;
}

let canWrite=true;
// muda vários documentos; o desfazer devolve os campos ao que eram (null quando não existiam)
async function setMany(changes,msg){
  if(!db||!canWrite){toast("Sem permissão pra gravar");return false}
  const backs=changes.map(([k,id,patch])=>{const prev=D[k].get(id)||{};const b={};Object.keys(patch).forEach(f=>b[f]=prev[f]===undefined?null:prev[f]);return [k,id,b]});
  try{for(const [k,id,patch] of changes)await db.doc(k+"/"+id).update(patch)}
  catch(e){toast("Não deu pra salvar; tente de novo");return false}
  toast(msg,async()=>{for(const [k,id,b] of backs)await db.doc(k+"/"+id).update(b)});
  return true;
}
// cria documentos; o desfazer apaga o que foi criado
async function addMany(adds,msg){
  if(!db||!canWrite){toast("Sem permissão pra gravar");return null}
  const ids=[];
  try{for(const [k,doc] of adds){const r=await db.collection(k).add(doc);ids.push([k,r.id])}}
  catch(e){for(const [k,id] of ids){try{await db.doc(k+"/"+id).delete()}catch(err){}} toast("Não deu pra salvar; nada foi criado");return null}
  toast(msg,async()=>{for(const [k,id] of ids)await db.doc(k+"/"+id).delete()});
  return ids;
}

    <div class="search">${ico("search")}<input id="ncq" type="search" placeholder="Era, versão ou loja" value="${esc(nc.q)}" aria-label="Buscar card"></div>
    ${nc.era?`<div class="chips"><button class="chip" data-ncera aria-pressed="true" type="button">Só ${esc(nc.era)} ✕</button></div>`:""}<div class="chips scroll">${["",...MEMBROS].map(m=>`<button class="chip" data-ncm="${esc(m)}" aria-pressed="${nc.m===m}" type="button">${esc(m||"Todos")}</button>`).join("")}</div>
    <div class="mini picker">${cs.map(c=>`<button class="tile ${nc.sel.has(c.i)?"sel":""}" data-ncc="${esc(c.i)}" type="button">${ph(cardBg(c),"",cardBg(c)?"":esc(c.v))}<span class="cap">${esc(c.v)}<small>${esc(c.m)} · ${esc(c.e)}</small></span></button>`).join("")}</div>
    ${tot>90?`<p class="note">Mostrando os 90 mais recentes de ${tot}. Busque para achar outros.</p>`:""}
    <details class="novo-card" style="margin-top:14px"><summary style="cursor:pointer;font-weight:650">Não está no catálogo? Criar card</summary>
      <div class="field"><label for="nkm">Membro</label><select id="nkm">${MEMBROS.map(m=>`<option ${m===nc.m?"selected":""}>${esc(m)}</option>`).join("")}<option>UNIT</option></select></div>
      <div class="field"><label for="nke">Era</label><input id="nke" value="${esc(nc.era)}" placeholder="ex.: DO IT"></div>
      <div class="field"><label for="nkv">Versão / loja</label><input id="nkv" placeholder="ex.: Soundwave fansign 2"></div>
      <button class="btn" data-act="criarcard" type="button">Criar e escolher</button></details>
    <div class="actions"><button class="btn pri" data-ncnext type="button" ${nc.sel.size?"":"disabled"}>${nc.mode==="link"?"Ligar":"Continuar"}</button></div>`}
  const r=cegs().find(x=>x.key===nc.ceg);
  return `${bar}<h2 style="margin-top:0">Quanto custou?</h2>
  <div class="field"><label for="ncv">Valor de cada card (R$)</label><input id="ncv" inputmode="decimal" placeholder="ex.: 28,50 (vazio se ainda não sabe)" value="${esc(nc.valor)}"></div>
  <div class="field"><label for="ncp">Prazo pra pagar</label><input id="ncp" type="date" value="${esc(nc.prazo||"")}"></div>
  <label style="display:flex;gap:10px;align-items:center;margin:8px 0"><input id="ncpg" type="checkbox" ${nc.pago?"checked":""} style="width:20px;height:20px;accent-color:var(--accent)">Já paguei</label>
  <p class="note">Vai criar ${plural(nc.sel.size,"pedido","pedidos")} em <b>${esc(r?r.lbl||r.nome:"")}</b>, já ligados ao card. Com valor, cria também uma conta "Item" pra ${esc(r?r.com:"")}. Os fretes entram depois, quando a GOM cobrar.</p>
  <div class="mini">${[...nc.sel].map(id=>{const c=CIDX.get(id);return c?`<div class="tile">${ph(cardBg(c),"","")}<span class="cap">${esc(c.v)}</span></div>`:""}).join("")}</div>
  <div class="actions"><button class="btn" data-ncback type="button">Voltar</button><button class="btn pri" data-act="salvar" type="button">Salvar compra</button></div>`;
}

// ---------- render ----------
let io=null;
function lazy(){
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const el=en.target;el.setAttribute("style",el.dataset.bg);el.removeAttribute("data-bg");io.unobserve(el)}}),{rootMargin:"300px"});
  document.querySelectorAll("[data-bg]").forEach(el=>io.observe(el));
}
function render(){
  nav();
  if(!ready){$("#main").innerHTML=`<p class="empty">Carregando…</p>`;return}
  if(!db){$("#main").innerHTML=`${head("Coleção SKZ")}<p class="note">Entre com a sua conta para ver os dados.</p>`;return}
  ({inicio:renderInicio,colecao:renderColecao,contas:renderContas,cegs:renderCegs})[ui.tab]();
  if(sheetFn){$("#shB").innerHTML=sheetFn();}
  lazy();
}
let t=null; const schedule=()=>{ver++; if(document.activeElement&&document.activeElement.matches("input"))return; clearTimeout(t);t=setTimeout(render,80)};
function go(tab){ui.tab=tab;history.replaceState(null,"","#"+tab);render();window.scrollTo(0,0)}

// ---------- eventos ----------
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-href]"); if(!b)return;
  const ds=b.dataset;
  if(ds.tab){go(ds.tab);return}
  if(ds.go){if(ds.cf){ui.cf=ds.cf;ui.cn=240}go(ds.go);return}
  if(ds.href){location.href=ds.href;return}
  if(ds.cf!=null){ui.cf=ds.cf;ui.cn=240;save();render();return}
  if(ds.cm!=null){ui.cm=ds.cm;ui.cn=240;render();return}
  if(ds.ct!=null){ui.ct=ds.ct;ui.cn=240;render();return}
  if(ds.kv){ui.kv=ds.kv;save();render();return}
  if(ds.gf){ui.gf=ds.gf;save();render();return}
  if(ds.gc!=null){ui.gc=ds.gc;render();return}
  if(ds.conta){openSheet("Conta",()=>contaSheet(ds.conta));return}
  if(ds.card){openSheet("Card",()=>cardSheet(ds.card));return}
  if(ds.ceg){const k=ds.ceg;openSheet("CEG",()=>cegSheet(k));return}
  if(ds.cegk!=null){const k=ds.cegk;if(cegs().some(r=>r.key===k)){$("#shT").textContent="CEG";sheetFn=()=>cegSheet(k);$("#shB").innerHTML=sheetFn();lazy();$("#shB").scrollTop=0}return}
  if(ds.envio){const id=ds.envio; if(sheetFn){$("#shT").textContent="Envio";sheetFn=()=>envioSheet(id);$("#shB").innerHTML=sheetFn();lazy();$("#shB").scrollTop=0}else openSheet("Envio",()=>envioSheet(id));return}
  if(ds.pix){const c=comInfo(ds.pix);try{await navigator.clipboard.writeText(c.pix);toast("Pix copiado")}catch(err){toast("Não deu pra copiar")}return}
  if(ds.ncera!=null){nc.era="";$("#shB").innerHTML=novaSheet();lazy();return}
  if(ds.ncceg){nc.ceg=ds.ncceg;nc.step=1;nc.q="";nc.era=eraDaCeg(cegs().find(r=>r.key===nc.ceg));$("#shB").innerHTML=novaSheet();lazy();return}
  if(ds.ncm!=null){nc.m=ds.ncm;$("#shB").innerHTML=novaSheet();lazy();return}
  if(ds.ncc){nc.sel.has(ds.ncc)?nc.sel.delete(ds.ncc):nc.sel.add(ds.ncc);b.classList.toggle("sel");const n=$("#shB h2 .n");if(n)n.textContent=nc.sel.size+" escolhidos";const nx=$("[data-ncnext]");if(nx)nx.disabled=!nc.sel.size;return}
  if(ds.ncnext!=null&&nc.mode==="link"){const ids=[...nc.sel]; b.disabled=true; if(await setMany([["itens",nc.item,{cards:ids}]],`${plural(ids.length,"card ligado","cards ligados")}`))closeSheet(); return}
  if(ds.ncnext!=null){nc.step=2;$("#shB").innerHTML=novaSheet();lazy();return}
  if(ds.ncback!=null){nc.step=1;$("#shB").innerHTML=novaSheet();lazy();return}
  if(ds.cst){const [id,st]=ds.cst.split("|"); const c=D.cobrancas.get(id); if(!c)return; const patch={status:st}; if(st==="Paga")patch.pagoEm=c.pagoEm||isoToday(); if(st==="Pendente"&&c.status==="Paga")patch.pagoEm=null; b.disabled=true;
    await setMany([["cobrancas",id,patch]],st==="Paga"?"Marcada como paga":c.status==="Paga"?"Voltou pra pagar":"Valor confirmado"); return}
  if(ds.liq){const r=cegs().find(x=>x.key===ds.liq); if(!r)return; const dv=r.contas.filter(devo);
    if(!b.dataset.sure){b.dataset.sure="1";b.textContent=`Toque de novo: marcar ${plural(dv.length,"conta","contas")} como pagas`;setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="Paguei tudo: "+brl(dv.reduce((s,c)=>s+(c.valor||0),0))}},5000);return}
    b.disabled=true; await setMany(dv.map(c=>["cobrancas",c.id,{status:"Paga",pagoEm:c.pagoEm||isoToday()}]),`${plural(dv.length,"conta paga","contas pagas")}`); return}
  if(ds.evst){const [id,st]=ds.evst.split("|"); const ids=[...document.querySelectorAll("#shB .evi:checked")].map(x=>x.value);
    const ch=[["envios",id,{status:st}],...ids.map(i=>["itens",i,{status:st==="Recebido"?"Recebido":"Envio pedido"}])]; b.disabled=true;
    if(await setMany(ch,st==="Recebido"?`Recebido${ids.length?", "+plural(ids.length,"item","itens")+" comigo":""}`:"Envio pedido"))closeSheet(); return}
  if(ds.link){const it=D.itens.get(ds.link); if(!it)return; const r=cegs().find(x=>x.com===(it.comunidade||"")&&x.nome===it.ceg);
    Object.assign(nc,{mode:"link",item:ds.link,step:1,ceg:"",sel:new Set(Array.isArray(it.cards)?it.cards:[]),q:"",m:MEMBROS.includes(membro(it.membro))?membro(it.membro):"",era:eraDaCeg(r)});
    $("#shT").textContent="Ligar ao catálogo";sheetFn=novaSheet;$("#shB").innerHTML=novaSheet();lazy();$("#shB").scrollTop=0;return}
  const a=ds.act;
  if(a==="fechar"){closeSheet();return}
  if(a==="criarcard"){const m=$("#nkm").value,e2=$("#nke").value.trim(),v=$("#nkv").value.trim(); if(!e2||!v){toast("Preencha era e versão");return}
    b.disabled=true; const r2=await addMany([["cardsnovos",{m,e:e2,v,t:"POB"}]],"Card criado"); if(r2){nc.sel.add("x-"+r2[0][1]);novos.set(r2[0][1],{m,e:e2,v,t:"POB"});mergeNovos();nc.era=e2;nc.q="";$("#shB").innerHTML=novaSheet();lazy()} else b.disabled=false; return}
  if(a==="salvar"){const r=cegs().find(x=>x.key===nc.ceg); if(!r)return; const v=parseFloat(String(nc.valor).replace(/\./g,"").replace(",","."));
    const val=isFinite(v)&&v>0?v:null, cs=[...nc.sel].map(id=>CIDX.get(id)).filter(Boolean); if(!cs.length)return;
    const pago=val?(nc.pago?"Sim":"Cobrado, não pago"):"Ainda não cobrado";
    const adds=cs.map(c=>["itens",{item:c.v||"",membro:c.m||"",comunidade:r.com,ceg:r.nome,valor:val,cards:[c.i],status:"Garantido",origem:"Claim",tipo:/[áa]lbum/i.test(c.t||"")?"Álbum":"Photocard / set",pago,criadoEm:isoToday()}]);
    if(val)adds.push(["cobrancas",{referente:`${cs.length>1?cs.length+" cards":"card"}: ${cs.map(c=>[c.m,c.v].filter(Boolean).join(" ")).join(", ")}`.slice(0,140),comunidade:r.com,ceg:r.nome,tipo:"Item",valor:Math.round(val*cs.length*100)/100,prazo:nc.prazo||"",status:nc.pago?"Paga":"Pendente",...(nc.pago?{pagoEm:isoToday()}:{}),origem:"app novo"}]);
    b.disabled=true; if(await addMany(adds,`Compra salva: ${plural(cs.length,"card","cards")}`))closeSheet(); else b.disabled=false; return}
  if(a==="envios"){openSheet("Pedir envio",enviosSheet);return}
  if(a==="maiscol"){ui.cn+=240;render();return}
  if(a==="tema"){const tt=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",tt);try{localStorage.setItem("novo-theme",tt)}catch(err){}return}
  if(a==="nova"){Object.assign(nc,{mode:"nova",item:"",step:0,ceg:"",sel:new Set(),q:"",m:"",valor:"",prazo:"",pago:false,era:""});openSheet("Nova compra",novaSheet);return}
});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetFn)closeSheet()});
let qt=null;
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="cq"||id==="gq"){clearTimeout(qt);qt=setTimeout(()=>{ui[id]=e.target.value;const pos=e.target.selectionStart;render();const el=$("#"+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(err){}}},180);return}
  if(id==="ncq"){clearTimeout(qt);qt=setTimeout(()=>{nc.q=e.target.value;$("#shB").innerHTML=novaSheet();lazy();const el=$("#ncq");el.focus();el.setSelectionRange(nc.q.length,nc.q.length)},200);return}
  if(id==="ncv"){nc.valor=e.target.value}
  if(id==="ncp"){nc.prazo=e.target.value}
});
document.addEventListener("focusout",e=>{if(e.target.matches&&e.target.matches("#cq,#gq"))setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches("input"))render()},50)});
document.addEventListener("change",e=>{if(e.target.id==="ncpg")nc.pago=e.target.checked; if(e.target.id==="ncp")nc.prazo=e.target.value});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==ui.tab){ui.tab=h;render()}});

// ---------- carga ----------
async function loadCol(){
  try{const r=await fetch("colecao.json");if(!r.ok)throw 0;COL=await r.json();COL.base=COL.items.slice();mergeNovos();}catch(e){COL=null}
  schedule();
}
function mergeNovos(){if(!COL||!COL.base)return;COL.items=COL.base.concat([...novos].map(([id,d])=>({i:"x-"+id,m:d.m||"",e:d.e||"",t:d.t||"POB",v:d.v||"",s:"",novo:true})));CIDX=new Map(COL.items.map(c=>[c.i,c]));}
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  ready=true; render(); if(!db)return;
  try{const u=await window.claude.use("user"); const w=u&&u.can?await u.can("data.write"):null; if(w===false)canWrite=false}catch(e){}
  COLS.forEach(k=>db.collection(k).limit(1000).onSnapshot(s=>{const m=new Map();s.docs.forEach(d=>m.set(d.id,d.data()));D[k]=m;schedule()},()=>{}));
  db.collection("fotos").limit(1000).onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());fotos=m;schedule()},()=>{});
  db.collection("colecao").limit(50).onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();m[d.id]=(x&&x.s&&typeof x.s==="object")?x.s:{}});posse=m;schedule()},()=>{});
  db.collection("cardsnovos").limit(1000).onSnapshot(s=>{const m=new Map();s.docs.forEach(d=>m.set(d.id,d.data()));novos=m;mergeNovos();schedule()},()=>{});
  loadCol();
})();
render();
})();
</script>
</body>
